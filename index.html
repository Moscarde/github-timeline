<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Timeline</title>
<meta name="description" content="Linha do tempo de qualquer perfil do GitHub, montada a partir dos metadados dos repositórios públicos">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<script>
  /* Base do site. Em GitHub Pages de projeto, tudo vive sob /<repo>/.
     Esta mesma página também é servida como 404.html, então a URL pode ser
     /github-timeline/<usuario> — os assets precisam de caminho absoluto. */
  (function () {
    var REPO = 'github-timeline';
    var seg = location.pathname.split('/').filter(Boolean);
    window.__BASE__ = seg[0] === REPO ? '/' + REPO + '/' : '/';
    try {
      var t = localStorage.getItem('ght-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --canvas: #ffffff;
    --canvas-subtle: #f6f8fa;
    --canvas-inset: #eef1f4;
    --border: #d1d9e0;
    --fg: #1f2328;
    --fg-muted: #59636e;
    --accent-fg: #0969da;
    --accent: #0969da;
    --danger-fg: #d1242f;
    --fork-fg: #6e7781;
    --rail: #d1d9e0;
    --node: #0969da;
    --shadow: 0 1px 0 rgba(31,35,40,0.04);
    --label-border: rgba(31,35,40,0.15);
    --lv0: #ebedf0; --lv1: #9be9a8; --lv2: #40c463; --lv3: #30a14e; --lv4: #216e39;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #0d1117;
      --canvas-subtle: #161b22;
      --canvas-inset: #010409;
      --border: #30363d;
      --fg: #e6edf3;
      --fg-muted: #7d8590;
      --accent-fg: #2f81f7;
      --accent: #2f81f7;
      --danger-fg: #f85149;
      --fork-fg: #7d8590;
      --rail: #30363d;
      --node: #2f81f7;
      --shadow: 0 0 transparent;
      --label-border: rgba(240,246,252,0.1);
      --lv0: #161b22; --lv1: #0e4429; --lv2: #006d32; --lv3: #26a641; --lv4: #39d353;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --canvas: #0d1117;
    --canvas-subtle: #161b22;
    --canvas-inset: #010409;
    --border: #30363d;
    --fg: #e6edf3;
    --fg-muted: #7d8590;
    --accent-fg: #2f81f7;
    --accent: #2f81f7;
    --danger-fg: #f85149;
    --fork-fg: #7d8590;
    --rail: #30363d;
    --node: #2f81f7;
    --shadow: 0 0 transparent;
    --label-border: rgba(240,246,252,0.1);
    --lv0: #161b22; --lv1: #0e4429; --lv2: #006d32; --lv3: #26a641; --lv4: #39d353;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--canvas); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  a { color: var(--accent-fg); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  code {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.88em; background: var(--canvas-subtle); border: 1px solid var(--border);
    padding: 1px 5px; border-radius: 5px;
  }

  .topbar {
    position: sticky; top: 0; z-index: 60; background: var(--canvas-subtle);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  }
  .topbar svg.mark { flex: none; fill: var(--fg); }
  .topbar .slug { color: var(--fg); }
  .topbar .slug:hover { text-decoration: none; }
  .topbar .slug .u { color: var(--fg-muted); }
  .topbar .slug .r { font-weight: 600; }
  .topbar .spacer { flex: 1; }
  .theme-toggle, .btn {
    background: var(--canvas); border: 1px solid var(--border); color: var(--fg-muted);
    border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .theme-toggle:hover, .btn:hover { border-color: var(--fg-muted); color: var(--fg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }

  .search { display: flex; gap: 6px; }
  .search input, .token-form input {
    background: var(--canvas); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; font-size: 13px; width: 180px; min-width: 0;
    font-family: "JetBrains Mono", ui-monospace, monospace;
  }
  .search input:focus, .token-form input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

  /* landing */
  .landing { padding: 96px 0 64px; max-width: 560px; }
  .landing h1 { font-size: 30px; line-height: 1.25; margin: 0 0 12px; font-weight: 600; letter-spacing: -0.01em; }
  .landing p { color: var(--fg-muted); font-size: 15px; margin: 0 0 24px; }
  .landing .search input { width: 100%; flex: 1; font-size: 15px; padding: 8px 12px; }
  .landing .search .btn { font-size: 14px; padding: 8px 16px; }
  .landing .hint { font-size: 12.5px; margin-top: 14px; color: var(--fg-muted); }

  .hero { padding: 44px 0 24px; border-bottom: 1px solid var(--border); }
  .hero .who { display: flex; gap: 20px; align-items: center; }
  .hero .avatar { width: 88px; height: 88px; border-radius: 50%; border: 1px solid var(--border); flex: none; background: var(--canvas-subtle); }
  .hero h1 {
    font-size: 30px; line-height: 1.25; margin: 0 0 4px; font-weight: 600;
    text-wrap: balance; letter-spacing: -0.01em;
  }
  .hero .login { color: var(--fg-muted); font-size: 16px; margin: 0 0 8px; }
  .hero p.bio { margin: 0; color: var(--fg-muted); max-width: 66ch; font-size: 15px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 24px; }
  .stat { border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; background: var(--canvas); }
  .stat .n { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--fg-muted); font-size: 12px; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 500; line-height: 18px;
    padding: 0 7px; border-radius: 999px; border: 1px solid var(--label-border);
    white-space: nowrap;
  }
  .badge svg { width: 11px; height: 11px; fill: currentColor; }
  .badge.fork, .badge.arch { color: var(--fork-fg); }

  .langsec { padding: 22px 0 6px; }
  h2.eyebrow, .langsec h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--fg-muted); font-weight: 600; margin: 0 0 12px;
  }
  .langbar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; gap: 2px; }
  .langlegend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 12px; }
  .langlegend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .langlegend .pct { color: var(--fg-muted); }

  /* timeline */
  .timeline { padding: 12px 0 32px; }
  .era { display: grid; grid-template-columns: 120px 22px 1fr; }
  .era-rail { position: relative; }
  .era-rail::before { content: ""; position: absolute; left: 5px; top: 0; bottom: 0; width: 2px; background: var(--rail); }
  .era:first-child .era-rail::before { top: 24px; }
  .era:last-child .era-rail::before { height: 34px; bottom: auto; }
  .era-marker { position: sticky; top: 62px; padding-top: 18px; }
  .era-marker .node {
    position: absolute; left: -1px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--node); border: 3px solid var(--canvas); box-sizing: content-box;
  }
  .era-marker .yr {
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 20px; font-weight: 700;
    padding-left: 24px; font-variant-numeric: tabular-nums;
  }
  .era-body { padding: 14px 0 40px 24px; min-width: 0; }

  .era-months {
    display: flex; flex-direction: column; gap: 3px;
    position: sticky; top: 62px; align-self: start; padding-top: 22px;
  }
  .era-months .mo {
    width: 14px; height: 14px; border-radius: 3px;
    background: var(--lv0); border: 1px solid var(--label-border);
    position: relative;
  }
  .era-months .mo:hover, .era-months .mo:focus-visible {
    outline: 2px solid var(--fg-muted); outline-offset: 1px;
  }
  .era-months .tip {
    position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%);
    z-index: 5; white-space: nowrap; pointer-events: none;
    background: var(--fg); color: var(--canvas);
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px;
    font-variant-numeric: tabular-nums; line-height: 1;
    padding: 5px 7px; border-radius: 6px;
    opacity: 0; visibility: hidden; transition: opacity .12s ease;
  }
  .era-months .tip::before {
    content: ""; position: absolute; right: 100%; top: 50%; transform: translateY(-50%);
    border: 4px solid transparent; border-right-color: var(--fg);
  }
  .era-months .tip b { font-weight: 500; opacity: .7; }
  .era-months .mo:hover .tip, .era-months .mo:focus-visible .tip { opacity: 1; visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .era-months .tip { transition: none; } }
  .era-months .mo.l1 { background: var(--lv1); }
  .era-months .mo.l2 { background: var(--lv2); }
  .era-months .mo.l3 { background: var(--lv3); }
  .era-months .mo.l4 { background: var(--lv4); }
  .commit-legend {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    color: var(--fg-muted); font-size: 12px; padding: 2px 0 10px;
  }
  .commit-legend i {
    width: 11px; height: 11px; border-radius: 2px; display: inline-block;
    border: 1px solid var(--label-border);
  }
  .commit-legend em { font-style: normal; color: var(--fg); }
  .commit-legend .note { flex-basis: 100%; }
  .commit-legend .total {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums; color: var(--fg);
  }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent-fg); cursor: pointer; font: inherit; }
  .linkish:hover { text-decoration: underline; }
  .token-form { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 0 2px; }
  .token-form input { width: 320px; }
  .token-form small { flex-basis: 100%; }

  .era-body > h3 { font-size: 20px; font-weight: 600; margin: 2px 0 6px; text-wrap: balance; }
  .era-body > .lead { margin: 0 0 14px; color: var(--fg-muted); max-width: 66ch; }
  .era-body > .lead b { color: var(--fg); font-weight: 600; }
  .skills { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
  .skill {
    font-size: 12px; padding: 1px 9px; border-radius: 999px;
    border: 1px solid var(--label-border); color: var(--accent-fg);
    background: color-mix(in srgb, var(--accent) 8%, transparent); font-weight: 500;
  }
  .skill.lang { color: var(--fg); background: var(--canvas-subtle); display: inline-flex; align-items: center; gap: 5px; }
  .skill.lang i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .repos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .repo {
    border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px;
    background: var(--canvas); display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow);
    min-width: 0;
  }
  .repo .rhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .repo .name { font-size: 14px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .repo .name .octo { fill: var(--fg-muted); vertical-align: middle; margin-right: 6px; }
  .repo .desc { color: var(--fg-muted); font-size: 12.5px; flex: 1; overflow-wrap: anywhere; }
  .repo .desc.empty { font-style: italic; opacity: .75; }
  .repo .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 12px; color: var(--fg-muted); }
  .repo .meta .lang { display: inline-flex; align-items: center; gap: 5px; }
  .repo .meta .ld { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 1px solid var(--label-border); }
  .repo .meta .st { display: inline-flex; align-items: center; gap: 3px; }
  .repo .meta svg { fill: var(--fg-muted); }
  .repo .topics { display: flex; flex-wrap: wrap; gap: 4px; }
  .repo .topics span {
    font-size: 11px; font-weight: 500; padding: 0 7px; border-radius: 999px; line-height: 18px;
    color: var(--accent-fg); background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .repo.big { grid-column: 1 / -1; border-color: var(--accent); }
  .more { margin-top: 12px; }

  /* estados */
  .state { padding: 72px 0; max-width: 560px; }
  .state h2 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
  .state p { color: var(--fg-muted); margin: 0 0 16px; }
  .state.error h2 { color: var(--danger-fg); }
  .skel { background: var(--canvas-subtle); border-radius: 6px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }

  .footer { border-top: 1px solid var(--border); padding: 24px 0 48px; color: var(--fg-muted); font-size: 12px; text-align: center; }

  @media (max-width: 820px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .repos { grid-template-columns: 1fr; }
    .era { grid-template-columns: 58px 16px 1fr; }
    .era-months { gap: 2px; }
    .era-months .mo { width: 10px; height: 10px; border-radius: 2px; }
    .era-marker .yr { font-size: 15px; padding-left: 20px; }
    .era-body { padding-left: 18px; }
    .hero h1, .landing h1 { font-size: 23px; }
    .hero .who { flex-direction: column; align-items: flex-start; gap: 12px; }
    .hero .avatar { width: 64px; height: 64px; }
    .topbar .slug { display: none; }
    .topbar .search input { width: 120px; }
    .token-form input { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="topbar">
  <svg class="mark" height="24" viewBox="0 0 16 16" width="24" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
  <a class="slug mono" id="slug" href="./"><span class="u" id="slug-user">github</span> / <span class="r">timeline</span></a>
  <span class="spacer"></span>
  <form class="search" id="topsearch" role="search">
    <input name="u" placeholder="usuário" aria-label="Usuário do GitHub" autocomplete="off" spellcheck="false">
  </form>
  <button class="theme-toggle" id="tt" type="button">tema</button>
</div>

<main class="wrap" id="app" aria-live="polite"></main>

<div class="wrap">
  <div class="footer">
    Dados da <a href="https://docs.github.com/rest">API pública do GitHub</a>, lidos no seu navegador &middot;
    visual inspirado no GitHub Primer &middot;
    <a href="https://github.com/Moscarde/github-timeline">código</a>
  </div>
</div>

<script>
  (function () {
    var s = document.createElement('script');
    s.type = 'module';
    s.src = window.__BASE__ + 'app.js';
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
